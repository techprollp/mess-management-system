<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch & Dinner Menu - Room 803 Mess</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Target for layout injection by app.js -->
    <div id="app">
        
        <!-- Header Bar -->
        <div class="header-bar">
            <div class="page-title">
                <h2>Lunch & Dinner Menu Planner</h2>
                <p>Configure the weekly food schedule. Members can see this on the Home portal.</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" id="reset-menu-btn"><i class="fa-solid fa-rotate-left"></i> Reset to Default</button>
            </div>
        </div>

        <!-- Weekly Menu Grid -->
        <div class="stats-grid" id="weekly-menu-cards" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
            <!-- Dynamically populated day cards -->
        </div>

    </div>

    <!-- Edit Menu Modal Dialog -->
    <div id="edit-menu-modal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Edit Menu: <span id="modal-day-name">Monday</span></h3>
                <button class="modal-close" id="close-menu-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="edit-menu-form">
                <div class="modal-body">
                    <input type="hidden" id="edit-day-key">
                    
                    <div class="form-group">
                        <label for="edit-lunch-input"><i class="fa-solid fa-sun" style="color: var(--warning);"></i> Lunch Menu</label>
                        <input type="text" id="edit-lunch-input" class="form-control" placeholder="e.g. Chicken Biryani + Salad" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="edit-dinner-input"><i class="fa-solid fa-moon" style="color: var(--info);"></i> Dinner Menu</label>
                        <input type="text" id="edit-dinner-input" class="form-control" placeholder="e.g. Chapati + Dal + Chicken Curry" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancel-menu-edit-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Menu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script dependencies -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
