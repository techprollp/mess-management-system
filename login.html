<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign In — Room 803 Mess</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-app);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background orbs */
        .login-page::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 113, 227, 0.06), transparent 70%);
            top: -200px;
            right: -200px;
        }

        .login-page::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(52, 199, 89, 0.05), transparent 70%);
            bottom: -150px;
            left: -150px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 48px 36px 40px;
            background-color: var(--bg-card);
            border: 0.5px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-float);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .login-icon {
            font-size: 48px;
            margin-bottom: 24px;
            display: block;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .login-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-weight: 400;
        }

        /* Segmented Control for Admin Selector */
        .segmented-control {
            display: flex;
            background-color: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 3px;
            margin-bottom: 20px;
            position: relative;
        }

        .segment-btn {
            flex: 1;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
            font-family: inherit;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .segment-btn.active {
            background-color: var(--bg-card);
            color: var(--text-main);
            font-weight: 600;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .segment-btn:active {
            transform: scale(0.97);
        }

        .login-input-group {
            position: relative;
            margin-bottom: 14px;
            text-align: left;
        }

        .login-input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .login-input-group .form-control {
            padding: 13px 16px;
            font-size: 16px;
            border-radius: var(--radius-sm);
        }

        .password-wrap {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-tertiary);
            transition: var(--transition);
            font-size: 16px;
            background: none;
            border: none;
            padding: 4px;
        }

        .password-toggle:hover {
            color: var(--text-main);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            border: none;
            background-color: var(--primary);
            color: #FFFFFF;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            letter-spacing: -0.01em;
            margin-top: 8px;
        }

        .login-btn:hover {
            background-color: var(--primary-hover);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 0.5px solid var(--separator);
        }

        .login-footer a {
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .login-footer a:hover {
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px 32px;
            }
        }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <span class="login-icon">🍽️</span>
        <div class="login-title">Mess Management</div>
        <div class="login-subtitle">Welcome back</div>

        <form id="login-form">
            <!-- Apple Segmented Control for Account Selection -->
            <div class="segmented-control" id="account-selector">
                <button type="button" class="segment-btn active" data-user="admin">
                    🛡️ Admin
                </button>
                <button type="button" class="segment-btn" data-user="mithun">
                    👤 Mithun
                </button>
                <button type="button" class="segment-btn" data-user="members">
                    👥 Members
                </button>
            </div>

            <input type="hidden" id="username" value="admin">

            <div class="login-input-group" style="margin-bottom: 24px;">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="toggle-pw-eye">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>
        </form>

        <div class="login-footer">
            <a href="index.html">
                <i class="fa-solid fa-arrow-left"></i> Back to Mess Portal
            </a>
        </div>
    </div>

    <script src="js/storage.js?v=30.0"></script>
    <script src="js/login.js?v=30.0"></script>
</body>
</html>
