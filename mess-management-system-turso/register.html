<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Member - Room 803 Mess</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Target for layout injection by app.js -->
    <div id="app">
        
        <!-- Header Bar -->
        <div class="header-bar">
            <div class="page-title">
                <h2>Register New Member</h2>
                <p>Register a new roommate to participate in the mess calculations.</p>
            </div>
            <div class="header-actions">
                <a href="members.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back to List</a>
            </div>
        </div>

        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div class="card-title">
                <span><i class="fa-solid fa-user-plus"></i> Member Registration Form</span>
            </div>
            
            <form id="register-member-form">
                <div class="form-group">
                    <label for="reg-name">Full Name *</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g. Abdullah Khan" required>
                </div>

                <div class="form-group">
                    <label for="reg-phone">Phone Number (WhatsApp friendly) *</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="e.g. +971501234567" required>
                    <span style="font-size: 11px; color: var(--text-muted);">Include country code (e.g. +971 for UAE) for automatic payment reminders.</span>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="e.g. abdullah@example.com">
                </div>

                <div class="form-group">
                    <label for="reg-date">Joined Date</label>
                    <input type="date" id="reg-date" class="form-control" required>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 32px;">
                    <a href="members.html" class="btn btn-secondary" style="flex: 1;">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="flex: 2;"><i class="fa-solid fa-circle-check"></i> Register Member</button>
                </div>
            </form>
        </div>

    </div>

    <!-- Script dependencies -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/members.js"></script>
</body>
</html>
