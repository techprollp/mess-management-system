<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Room 803 Mess</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.18), transparent 60%), radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.15), transparent 60%), var(--bg-app);
            padding: 16px;
        }
        
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 44px 36px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .login-logo {
            width: 68px;
            height: 68px;
            border-radius: var(--radius-lg);
            background: var(--primary-gradient);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin: 0 auto 24px auto;
            box-shadow: var(--shadow-gradient);
        }

        .login-title h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-title p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 14px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .password-toggle:hover {
            color: var(--text-main);
        }

        .user-badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: var(--bg-app);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary-light);
        }
    </style>
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-logo">
            <i class="fa-solid fa-hotel"></i>
        </div>
        <div class="login-title">
            <h2>Admin Access Portal</h2>
            <p>Room 803 Mess Management System</p>
        </div>

        <form id="login-form">
            <div class="form-group" style="text-align: left;">
                <label for="username"><i class="fa-solid fa-user-shield"></i> Select Admin Account</label>
                <select id="username" class="form-control" style="font-weight: 600;">
                    <option value="admin">Admin (Default Account)</option>
                    <option value="mithun">Mithun (Full Permission Admin)</option>
                </select>
            </div>
            
            <div class="form-group" style="text-align: left; margin-bottom: 28px;">
                <label for="password"><i class="fa-solid fa-key"></i> Admin Password</label>
                <div class="password-container">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <i class="fa-solid fa-eye-slash password-toggle" id="toggle-pw-eye"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 15px; border-radius: var(--radius-md);">
                <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
            </button>
        </form>

        <div style="margin-top: 28px; border-top: 1px solid var(--border-color); padding-top: 20px;">
            <a href="index.html" style="font-size: 13.5px; font-weight: 600; text-decoration: none; color: var(--primary-light); display: inline-flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-arrow-left-long"></i> Back to Public Mess Portal
            </a>
        </div>
    </div>

    <!-- Script dependencies -->
    <script src="js/storage.js?v=29.0"></script>
    <script src="js/login.js?v=29.0"></script>
</body>
</html>
