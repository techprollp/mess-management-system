<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Attendance - Room 803 Mess</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Target for layout injection by app.js -->
    <div id="app">
        
        <!-- Header Bar -->
        <div class="header-bar">
            <div class="page-title">
                <h2>Daily Attendance Tracker</h2>
                <p>Log which roommates participated in lunch and dinner. Pro-rata shares are updated instantly.</p>
            </div>
        </div>

        <!-- Date selector card -->
        <div class="card" style="padding: 16px; margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
            <div style="display:flex; align-items:center; gap:12px;">
                <label for="attendance-date" style="font-weight: 600; font-size: 14px; margin-bottom:0;">Select Date:</label>
                <input type="date" id="attendance-date" class="form-control" style="max-width: 180px;">
            </div>
            
            <div style="display:flex; gap:12px;" class="form-row">
                <button class="btn btn-outline btn-sm" id="toggle-all-lunch"><i class="fa-solid fa-sun"></i> Toggle All Lunch</button>
                <button class="btn btn-outline btn-sm" id="toggle-all-dinner"><i class="fa-solid fa-moon"></i> Toggle All Dinner</button>
            </div>
        </div>

        <!-- Attendance Form list -->
        <div class="card">
            <div class="card-title">
                <span><i class="fa-solid fa-clipboard-user"></i> Roommate Attendance Log</span>
                <span id="date-badge-label" class="badge badge-success" style="font-size:12px;">Today</span>
            </div>

            <form id="attendance-log-form">
                <!-- Desktop Table View -->
                <div class="table-responsive desktop-table-only">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Roommate Name</th>
                                <th>Phone</th>
                                <th style="text-align: center; width: 150px;">Lunch Menu</th>
                                <th style="text-align: center; width: 150px;">Dinner Menu</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-table-body">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>

                <!-- Mobile Stacked Card View -->
                <div id="attendance-mobile-list" style="display: none; margin-bottom: 24px;">
                    <!-- Populated dynamically -->
                </div>

                <div style="margin-top: 24px; display:flex; justify-content:flex-end;">
                    <button type="submit" class="btn btn-primary" style="padding: 12px 32px; font-size: 15px;"><i class="fa-solid fa-cloud-arrow-up"></i> Save Daily Attendance</button>
                </div>
            </form>
        </div>

    </div>

    <!-- Script dependencies -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/attendance.js"></script>
</body>
</html>
